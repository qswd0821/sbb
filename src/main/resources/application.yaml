spring:
  output:
    ansi:
      enabled: always
  application:
    name: sbb
  profiles:
    active: dev
  mvc:
    hiddenmethod:
      filter:
        enabled: true # 폼의 _method=delete/put 파라미터로 @DeleteMapping/@PutMapping 사용 (14168 41강)
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
