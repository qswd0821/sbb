<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>질문 등록</title></head>
<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">질문등록</h5>
    <!--
      등록 : POST /questions/write, 수정 : PUT /questions/{id}/modify (모델에 question 이 있으면 수정)
      th:method="put" → method="post" + hidden _method=put, th:action → CSRF hidden 자동 삽입
    -->
    <form th:object="${questionForm}"
          th:action="@{${question == null ? '/questions/write' : '/questions/' + question.id + '/modify'}}"
          th:method="${question == null ? 'post' : 'put'}">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="categoryId" class="form-label">카테고리</label>
            <select th:field="*{categoryId}" class="form-select">
                <option value="">-- 선택 --</option>
                <option th:each="c : ${categoryList}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <input type="text" th:field="*{subject}" class="form-control">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10" data-markdown-editor></textarea>
        </div>
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</html>
