<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>프로필</title></head>
<div layout:fragment="content" class="container my-3">
    <h4 class="border-bottom pb-2">프로필</h4>
    <!-- 기본 정보 -->
    <div class="card my-3">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-2">사용자ID</dt>
                <dd class="col-sm-10" th:text="${user.username}"></dd>
                <dt class="col-sm-2">이메일</dt>
                <dd class="col-sm-10" th:text="${user.email}"></dd>
                <dt class="col-sm-2">활동</dt>
                <dd class="col-sm-10" th:text="|질문 ${questionCount} · 답변 ${answerCount} · 댓글 ${commentCount}|"></dd>
            </dl>
        </div>
    </div>

    <div class="row">
        <!-- 내가 쓴 질문 -->
        <div class="col-md-4">
            <h6 class="border-bottom pb-2">최근 질문</h6>
            <ul class="list-unstyled small">
                <li th:each="q : ${questionList}" class="mb-1">
                    <a th:href="@{|/questions/${q.id}|}" th:text="${q.subject}"></a>
                    <span class="text-muted" th:text="${#temporals.format(q.createDate, 'MM-dd HH:mm')}"></span>
                </li>
                <li th:if="${#lists.isEmpty(questionList)}" class="text-muted">작성한 질문이 없습니다.</li>
            </ul>
        </div>
        <!-- 내가 쓴 답변 -->
        <div class="col-md-4">
            <h6 class="border-bottom pb-2">최근 답변</h6>
            <ul class="list-unstyled small">
                <li th:each="a : ${answerList}" class="mb-1">
                    <a th:href="@{|/questions/${a.question.id}#answer_${a.id}|}"
                       th:text="${#strings.abbreviate(a.content, 30)}"></a>
                    <span class="text-muted" th:text="${#temporals.format(a.createDate, 'MM-dd HH:mm')}"></span>
                </li>
                <li th:if="${#lists.isEmpty(answerList)}" class="text-muted">작성한 답변이 없습니다.</li>
            </ul>
        </div>
        <!-- 내가 쓴 댓글 -->
        <div class="col-md-4">
            <h6 class="border-bottom pb-2">최근 댓글</h6>
            <ul class="list-unstyled small">
                <li th:each="c : ${commentList}" class="mb-1">
                    <a th:href="@{|/questions/${c.questionId}|}"
                       th:text="${#strings.abbreviate(c.content, 30)}"></a>
                    <span class="text-muted" th:text="${#temporals.format(c.createDate, 'MM-dd HH:mm')}"></span>
                </li>
                <li th:if="${#lists.isEmpty(commentList)}" class="text-muted">작성한 댓글이 없습니다.</li>
            </ul>
        </div>
    </div>
</div>
</html>
