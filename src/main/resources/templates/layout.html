<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS (cdnjs) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <!-- 마크다운 에디터 EasyMDE (3-14). 책이 추천한 simpleMDE 는 관리가 중단되어 그 후속 포크를 사용 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
    <!-- sbb CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
    <!--/* 각 페이지의 title 뒤에 " | SBB" 를 붙인다 (14168 45강). 타임리프 주석이라 응답 HTML 에는 나가지 않는다 */-->
    <title layout:title-pattern="$CONTENT_TITLE | SBB">SBB</title>
</head>
<body>
<!-- 네비게이션바 (navbar.html 프래그먼트) -->
<nav th:replace="~{navbar :: navbarFragment}"></nav>
<!-- 기본 템플릿 안에 삽입될 내용 Start -->
<th:block layout:fragment="content"></th:block>
<!-- 기본 템플릿 안에 삽입될 내용 End -->
<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
<!-- sbb 공통 JS -->
<script th:src="@{/global.js}"></script>
<!-- 각 페이지의 자바스크립트 -->
<th:block layout:fragment="script"></th:block>
</body>
</html>
