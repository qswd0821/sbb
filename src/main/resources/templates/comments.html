<!--/*
  댓글 목록 + 작성 폼 프래그먼트 (질문/답변 공통, 3-14 댓글)
  - comments : 댓글 목록
  - actionUrl : 댓글 작성 POST 주소
*/-->
<div th:fragment="commentsFragment(comments, actionUrl)" class="mt-3 border-top pt-2 small"
     xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div th:each="comment : ${comments}" class="d-flex align-items-start py-1 border-bottom">
        <div class="flex-grow-1">
            <span th:text="${comment.content}"></span>
            <span class="text-muted ms-2">
                - <span th:text="${comment.author != null ? comment.author.username : ''}"></span>,
                <span th:text="${#temporals.format(comment.createDate, 'yyyy-MM-dd HH:mm')}"></span>
            </span>
        </div>
        <form th:action="@{|/questions/${comment.questionId}/comments/${comment.id}/delete|}" th:method="delete" class="ms-2"
              onsubmit="return confirm('댓글을 삭제하시겠습니까?');"
              sec:authorize="isAuthenticated()"
              th:if="${comment.author != null and #authentication.getPrincipal().getUsername() == comment.author.username}">
            <button type="submit" class="btn btn-link btn-sm p-0 text-danger">삭제</button>
        </form>
    </div>
    <form th:action="${actionUrl}" method="post" class="input-group input-group-sm mt-2"
          sec:authorize="isAuthenticated()">
        <input type="text" name="content" class="form-control" placeholder="댓글 달기" maxlength="500">
        <button type="submit" class="btn btn-outline-secondary">등록</button>
    </form>
</div>
