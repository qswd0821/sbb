<nav th:fragment="navbarFragment" class="navbar navbar-expand-lg navbar-light bg-light border-bottom"
     xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">SBB</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <!-- 카테고리 메뉴 (3-14) -->
                <li class="nav-item" th:each="c : ${categoryList}">
                    <a class="nav-link" th:href="@{/questions(category=${c.id})}" th:text="${c.name}"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/recent}">최근 활동</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <!-- 로그인 전 -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/user/login}">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/user/signup}">회원가입</a>
                </li>
                <!-- 로그인 후 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <!-- 사용자명 → 프로필 (3-14) -->
                    <a class="nav-link" th:href="@{/user/profile}" sec:authentication="name"></a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/user/password}">비밀번호 변경</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <!-- 책은 GET 링크, 여기서는 POST 폼 (th:action → CSRF 토큰 자동) -->
                    <form th:action="@{/user/logout}" method="post" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link">로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
