<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>비밀번호 변경</title></head>
<div layout:fragment="content" class="container my-3">
    <div class="my-3 border-bottom">
        <h4>비밀번호 변경</h4>
    </div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <form th:action="@{/user/password}" th:object="${passwordChangeForm}" method="post">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="currentPassword" class="form-label">현재 비밀번호</label>
            <input type="password" th:field="*{currentPassword}" class="form-control">
        </div>
        <div class="mb-3">
            <label for="newPassword1" class="form-label">새 비밀번호</label>
            <input type="password" th:field="*{newPassword1}" class="form-control">
        </div>
        <div class="mb-3">
            <label for="newPassword2" class="form-label">새 비밀번호 확인</label>
            <input type="password" th:field="*{newPassword2}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">변경하기</button>
    </form>
</div>
</html>
